<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boulangerie Martin — Brand Guidelines</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-950 text-white p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-2">Boulangerie Martin</h1>
        <p class="text-gray-400 text-lg mb-12">Brand Guidelines</p>
        
        <section class="mb-12">
            <h2 class="text-2xl font-semibold mb-6">Color Palette</h2>
            <div class="grid grid-cols-3 gap-6">
                <div class="text-center">
                    <div class="w-full h-24 rounded-xl mb-3" style="background-color: #8B0000"></div>
                    <p class="font-medium">Primary</p>
                    <p class="text-gray-500 text-sm">#8B0000</p>
                </div>
                <div class="text-center">
                    <div class="w-full h-24 rounded-xl mb-3 border border-gray-700" style="background-color: #FFF8DC"></div>
                    <p class="font-medium">Secondary</p>
                    <p class="text-gray-500 text-sm">#FFF8DC</p>
                </div>
                <div class="text-center">
                    <div class="w-full h-24 rounded-xl mb-3" style="background-color: #4A4A4A"></div>
                    <p class="font-medium">Accent</p>
                    <p class="text-gray-500 text-sm">#4A4A4A</p>
                </div>
            </div>
        </section>
        
        <section class="mb-12">
            <h2 class="text-2xl font-semibold mb-6">Typography</h2>
            <p class="text-gray-400 text-lg">rustic hand-drawn headings with modern body text</p>
        </section>
        
        <section class="mb-12">
            <h2 class="text-2xl font-semibold mb-6">Brand Voice</h2>
            <p class="text-gray-400 text-lg">sophisticated, approachable, memorable</p>
        </section>
        
        <footer class="border-t border-gray-800 pt-8 text-center text-gray-600 text-sm">
            <p>Generated by Zero Employee Studio OS</p>
        </footer>
    </div>
</body>
</html>
