<!doctype html>
<html>
<head>
  <title>Ma Petite Boutique</title>
  <meta name="description" content="">
  <style>
    body { font-family: Arial; margin: 0; padding: 20px; background: white; color: black; }
    .header { background: #eee; padding: 10px; text-align: center; }
    .product { border: 1px solid #ddd; padding: 15px; margin: 20px 0; }
    .footer { background: #eee; padding: 10px; text-align: center; margin-top: 40px; }
    input { padding: 8px; border: 1px solid #ccc; }
    button { background: #333; color: white; padding: 8px 20px; border: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Ma Petite Boutique</h1>
    <p>Bienvenue sur notre site</p>
  </div>

  <form>
    <input type="text" placeholder="Rechercher...">
    <button>OK</button>
  </form>

  <div class="product">
    <h2>Produit 1</h2>
    <p>Super produit à un prix incroyable !</p>
    <p><strong>Prix: 29€</strong></p>
    <button>Acheter</button>
  </div>

  <div class="product">
    <h2>Produit 2</h2>
    <p>Encore mieux que le premier.</p>
    <p><strong>Prix: 49€</strong></p>
    <button>Acheter</button>
  </div>

  <div class="footer">
    <p>Contact: contact@petiteboutique.fr</p>
    <p>&copy; 2026 Ma Petite Boutique</p>
  </div>
</body>
</html>
